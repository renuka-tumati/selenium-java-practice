<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Order Portal</title><style>body{font-family:Arial,sans-serif;max-width:700px;margin:45px auto}section{border:1px solid #bbb;padding:18px;margin:16px 0}label{display:block;margin:10px 0}button{padding:8px 14px}#dashboard,#orderPanel{display:none}.error{color:#b00020}.success{color:green}</style></head><body>
<h1>Acme Order Portal</h1><section id="loginPanel"><h2>Sign in</h2><label>Username <input id="username" autocomplete="off"></label><label>Password <input id="password" type="password"></label><button id="loginButton">Sign in</button><p id="loginError" class="error" role="alert"></p></section>
<section id="dashboard"><h2 id="welcome">Dashboard</h2><button id="newOrder">New order</button><button id="logout">Sign out</button><p id="orderSuccess" class="success" role="status"></p></section>
<section id="orderPanel"><h2>Create order</h2><label>Product <select id="product"><option value="">Select product</option><option value="keyboard">Keyboard</option><option value="mouse">Mouse</option></select></label><label>Quantity <input id="quantity" type="number" min="1" max="10" value="1"></label><button id="submitOrder">Place order</button><p id="orderError" class="error" role="alert"></p></section>
<script>
const $=id=>document.getElementById(id);let orderNumber=1000;let pending=false;
$('loginButton').onclick=()=>{if(pending)return;pending=true;$('loginButton').disabled=true;$('loginError').textContent='';setTimeout(()=>{pending=false;$('loginButton').disabled=false;if($('username').value==='qa_user'&&$('password').value==='Passw0rd!'){$('loginPanel').style.display='none';$('dashboard').style.display='block';$('welcome').textContent='Welcome, qa_user';}else{$('loginError').textContent='Invalid username or password';}},900)};
$('newOrder').onclick=()=>{$('orderPanel').style.display='block';$('orderSuccess').textContent='';$('orderError').textContent='';};
$('submitOrder').onclick=()=>{const qty=Number($('quantity').value);if(!$('product').value){$('orderError').textContent='Select a product';return;}if(!Number.isInteger(qty)||qty<1||qty>10){$('orderError').textContent='Quantity must be between 1 and 10';return;}$('orderError').textContent='';$('submitOrder').disabled=true;setTimeout(()=>{orderNumber++;$('orderSuccess').textContent=`Order #${orderNumber} created`;$('orderPanel').style.display='none';$('submitOrder').disabled=false;},650)};
$('logout').onclick=()=>{$('dashboard').style.display='none';$('orderPanel').style.display='none';$('loginPanel').style.display='block';$('username').value='';$('password').value='';$('loginError').textContent='';};
</script></body></html>
